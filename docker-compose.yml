# =============================================================================
# Local production-like stack (NOT for a public server).
#   docker compose up --build
#   open http://localhost:8080/api/documentation
#
# The credentials below are throwaway values for a local MySQL container and
# are intentionally NOT the credentials used anywhere real. Change them if you
# like; they are never committed for a real deployment.
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_NAME: "SLSEA Solar Generation API (local docker)"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      # LOCAL TEST KEY ONLY - replace for any real deployment.
      APP_KEY: "base64:2mOq9tE1k8kq7fW3P2r0m0V1s4Q2Z9xY6bC5nH8jK1A="
      JWT_SECRET: "local-test-only-jwt-secret-0123456789abcdef"
      JWT_ALGO: HS256
      JWT_ISSUER: solar-generation-api
      JWT_AUDIENCE: slsea-api
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: solar
      DB_USERNAME: solar
      DB_PASSWORD: local-test-password
      SESSION_DRIVER: cookie
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      FORCE_HTTPS: "false"
      TRUSTED_PROXIES: ""
      L5_SWAGGER_GENERATE_ALWAYS: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: solar
      MYSQL_USER: solar
      MYSQL_PASSWORD: local-test-password
      MYSQL_ROOT_PASSWORD: local-test-root-password
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
